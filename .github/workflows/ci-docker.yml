name: CI/CD Docker to GCP

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - dev

env:
  # GCP
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: asia-southeast1
  API_SERVICE_NAME: productshop-api
  FRONTEND_SERVICE_NAME: productshop-frontend

  # Docker Hub
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  API_IMAGE_NAME: productshop-api
  FRONTEND_IMAGE_NAME: productshop-frontend

jobs:
  ######################################################
  # JOB 1: CHẠY TEST TRÊN PULL REQUEST VÀO `dev`
  ######################################################
  run-tests:
    name: Build and Run Tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Unit Tests
        run: echo "Chạy unit test ở đây... Nếu thất bại, pipeline sẽ dừng."

      - name: Build check (Không push)
        run: |
          echo "Build thử Docker images để kiểm tra lỗi cú pháp Dockerfile..."
          docker build -t temp-api ./backend/backend
          docker build -t temp-frontend ./frontend

  ######################################################
  # JOB 2: BUILD & DEPLOY LÊN MÔI TRƯỜNG STAGING (DEV)
  ######################################################
  deploy-to-staging:
    name: Build and Deploy to Staging
    if: github.event_name == 'push' && github.ref_name == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # Tạm thời không cần nhưng để lại cho sau này
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Images
        run: |
          docker build -t ${{ env.DOCKERHUB_USERNAME }}/${{ env.API_IMAGE_NAME }}:dev ./backend/backend
          docker push ${{ env.DOCKERHUB_USERNAME }}/${{ env.API_IMAGE_NAME }}:dev
          
          docker build -t ${{ env.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE_NAME }}:dev ./frontend
          docker push ${{ env.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE_NAME }}:dev

      # --- PHẦN NÀY ĐÃ ĐƯỢC CHỈNH SỬA ---
      - name: Simulate Deploy to Staging
        run: |
          echo "---------------------------------------------------------"
          echo "✅ MÔ PHỎNG: Triển khai lên môi trường Staging thành công!"
          echo "Tên dịch vụ API: ${{ env.API_SERVICE_NAME }}-staging"
          echo "Tên dịch vụ Frontend: ${{ env.FRONTEND_SERVICE_NAME }}-staging"
          echo "Image được deploy: ...:dev"
          echo "---------------------------------------------------------"

  ######################################################
  # JOB 3: BUILD & DEPLOY LÊN MÔI TRƯỜNG PRODUCTION
  ######################################################
  deploy-to-production:
    name: Build and Deploy to Production
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: 'read'
      id-token: 'write' # Tạm thời không cần nhưng để lại cho sau này
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Images with Immutable Tag
        run: |
          COMMIT_SHA_SHORT=$(git rev-parse --short HEAD)
          
          docker build -t ${{ env.DOCKERHUB_USERNAME }}/${{ env.API_IMAGE_NAME }}:latest -t ${{ env.DOCKERHUB_USERNAME }}/${{ env.API_IMAGE_NAME }}:${COMMIT_SHA_SHORT} ./backend/backend
          docker push ${{ env.DOCKERHUB_USERNAME }}/${{ env.API_IMAGE_NAME }}:latest
          docker push ${{ env.DOCKERHUB_USERNAME }}/${{ env.API_IMAGE_NAME }}:${COMMIT_SHA_SHORT}

          docker build -t ${{ env.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE_NAME }}:latest -t ${{ env.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE_NAME }}:${COMMIT_SHA_SHORT} ./frontend
          docker push ${{ env.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE_NAME }}:latest
          docker push ${{ env.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE_NAME }}:${COMMIT_SHA_SHORT}
          
          # Lưu mã commit vào biến môi trường để bước sau có thể dùng
          echo "COMMIT_SHA_SHORT=${COMMIT_SHA_SHORT}" >> $GITHUB_ENV

      # --- PHẦN NÀY ĐÃ ĐƯỢC CHỈNH SỬA ---
      - name: Simulate Deploy to Production
        run: |
          echo "---------------------------------------------------------"
          echo "🚀 MÔ PHỎNG: Triển khai lên môi trường PRODUCTION thành công!"
          echo "Tên dịch vụ API: ${{ env.API_SERVICE_NAME }}"
          echo "Tên dịch vụ Frontend: ${{ env.FRONTEND_SERVICE_NAME }}"
          echo "Image được deploy: ...:${{ env.COMMIT_SHA_SHORT }}"
          echo "---------------------------------------------------------"
