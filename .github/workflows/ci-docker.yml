jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write 
      contents: read  
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::474668406667:role/GitHubAction-Deploy-Role
          aws-region: ap-southeast-1

      - name: Test AWS Access
        run: aws s3 ls # Thử nghiệm xem đã connect được chưa
